name: Windows build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag and app version must match.' }
      - name: Test, publish and package
        shell: pwsh
        run: ./tools/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WXPlayer-Windows-x64
          path: |
            artifacts/WXPlayer.exe
            artifacts/WXPlayer-win-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/test-results.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WXPlayer-Windows-x64
          path: artifacts
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GH_REPO" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GH_REPO" --verify-tag --generate-notes artifacts/WXPlayer.exe artifacts/WXPlayer-win-x64.zip artifacts/SHA256SUMS.txt
          } else {
            gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GH_REPO" artifacts/WXPlayer.exe artifacts/WXPlayer-win-x64.zip artifacts/SHA256SUMS.txt --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }
